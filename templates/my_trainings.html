{% extends 'base.html' %}
{% block title %}Meine Trainings{% endblock %}
{% block content %}
<header class="page-head">
  <div><h1 class="large-title">Trainings</h1></div>
  <div class="head-actions">
    <button class="btn btn-primary" type="button" id="newTrBtn"><svg class="i sm"><use href="#i-plus"/></svg><span class="btn-label">Neues Training</span></button>
    {% include '_avatar.html' %}
  </div>
</header>
<div class="stat-strip" id="trStats">
  <div class="stat glass"><b id="stTotal">–</b><span>Gesamt</span></div>
  <div class="stat glass"><b id="stMonth">–</b><span>Diesen Monat</span></div>
  <div class="stat glass"><b id="stEx">–</b><span>Übungen gesamt</span></div>
</div>
<div class="toolbar"><label class="search"><svg class="i"><use href="#i-search"/></svg><input class="input" type="search" id="trSearch" placeholder="Trainings durchsuchen" autocomplete="off" aria-label="Trainings durchsuchen"></label></div>
<div id="trList"></div>
{% endblock %}
{% block scripts %}<script src="/static/js/my_trainings.js?v={{ APP_VERSION }}"></script>{% endblock %}
