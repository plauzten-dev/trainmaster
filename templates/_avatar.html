<a href="/settings" class="head-avatar mobile-only" aria-label="Einstellungen">
  {% if current_user.avatar_path %}<span class="avatar sm"><img src="{{ current_user.avatar_path if current_user.avatar_path.startswith('http') else '/uploads/' ~ current_user.avatar_path }}" alt=""></span>{% else %}<span class="avatar sm">{{ current_user.username[:1]|upper }}</span>{% endif %}
</a>
