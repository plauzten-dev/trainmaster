# Beispielkonfiguration fuer Fly.io – App-Namen und Region anpassen.
# Secrets setzen mit:  fly secrets set SECRET_KEY=... OPERATOR_NAME=... OPERATOR_EMAIL=...
app = "trainmaster-beispiel"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/trainmaster.db"
  UPLOAD_DIR = "/data/uploads"

[[mounts]]
  source = "trainmaster_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
